# =========================
# Kernel Builder Config
# =========================

# For optional values set value "" if you dont want to set anything

# --- Architecture --- Required
ARCH=arm64

# --- Toolchain --- Root of folder of the toolchain here - Required
TD="$HOME/toolchains/clang-r416183b"

# --- Paths --- Required except CROSS_COMPILE_ARM32
BIN_PATH=${TD}/bin
CC=${BIN_PATH}/clang
CLANG_TRIPLE=aarch64-linux-gnu-
CROSS_COMPILE="$HOME/toolchains/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
CROSS_COMPILE_ARM32="$HOME/toolchains/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"

# --- Build Flags --- Optional except SECTION_MISMATCH_WARN_ONLY
KCFLAGS=""
KCPPFLAGS=""
ANDROID_MAJOR_VERSION=""
SECTION_MISMATCH_WARN_ONLY=y # y for warn only, e for normal mismatch, n for disabled (doesnt export CONFIG_SECTION_MISMATCH_WARN_ONLY or CONFIG_SECTION_MISMATCH)
ENV=""

# --- Build output --- Required
OUT_DIR=out
MODULES_OUT_DIR=out_modules
