# =========================
# Kernel Builder Config
# =========================

# For optional values set value "" if you dont want to set anything

# --- Architecture --- Required
ARCH=arm64

# --- Toolchain --- Root of folder of the toolchain here - Required
TD="$HOME/toolchains/clang-22.0.2-r596125/bin"
ARM64="$HOME/toolchains/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
ARM32="$HOME/toolchains/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin"

# --- Paths --- Required except CROSS_COMPILE_ARM32
BIN_PATH="$TD:$ARM64:$ARM"
CC=${TD}/clang
CLANG_TRIPLE=aarch64-linux-gnu-
CROSS_COMPILE=aarch64-linux-android-
CROSS_COMPILE_ARM32=arm-linux-androideabi-

# --- Build Flags --- Optional except SECTION_MISMATCH_WARN_ONLY
KCFLAGS=""
KCPPFLAGS=""
ANDROID_MAJOR_VERSION=""
SECTION_MISMATCH_WARN_ONLY=n # y for warn only, e for normal mismatch, n for disabled (doesnt export CONFIG_SECTION_MISMATCH_WARN_ONLY or CONFIG_SECTION_MISMATCH)
ENV=""

# --- Build output --- Required
OUT_DIR=out
MODULES_OUT_DIR=out_modules
